<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ulangan Online – Siswa</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b2233;--muted:#6b7488;--primary:#4f46e5;--primary-t:#fff;--border:#d9deea;--err:#c62828;--ok:#1b8a4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1320;--card:#181e30;--text:#e8ebf5;--muted:#98a1b8;--primary:#7c83ff;--primary-t:#0f1320;--border:#2b3350;--err:#ff7b7b;--ok:#4cd38a}}
:root[data-theme="dark"]{--bg:#0f1320;--card:#181e30;--text:#e8ebf5;--muted:#98a1b8;--primary:#7c83ff;--primary-t:#0f1320;--border:#2b3350;--err:#ff7b7b;--ok:#4cd38a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 24px;box-shadow:0 8px 30px rgba(0,0,0,.08);transition:max-width .3s ease}
.card.wide{max-width:960px}
.logo{width:56px;height:56px;border-radius:14px;background:var(--primary);color:var(--primary-t);display:grid;place-items:center;font-size:28px;margin:0 auto 14px}
h1{font-size:1.35rem;text-align:center;margin:0 0 4px}
.sub{text-align:center;color:var(--muted);font-size:.9rem;margin:0 0 22px}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:12px 14px;font-size:1rem;border:1.5px solid var(--border);border-radius:10px;background:transparent;color:var(--text);outline:none}
input:focus{border-color:var(--primary)}
#token{text-align:center;font-size:1.4rem;letter-spacing:.3em;text-transform:uppercase;font-weight:700}
button{width:100%;margin-top:20px;padding:13px;font-size:1rem;font-weight:700;border:0;border-radius:10px;background:var(--primary);color:var(--primary-t);cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{min-height:1.2em;margin-top:12px;font-size:.88rem;text-align:center;color:var(--err)}
.hidden{display:none!important}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.bar small{color:var(--muted)}
.timer{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:10px;background:var(--bg)}
.timer.warn{color:var(--err)}
iframe{width:100%;height:70vh;border:1px solid var(--border);border-radius:10px;background:#fff}
.sm{display:block;text-align:center;margin-top:10px;font-size:.82rem;color:var(--muted);text-decoration:none}
.sm:hover{text-decoration:underline}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.95rem}
.row:last-child{border-bottom:0}
.row span{color:var(--muted)}
.row b{text-align:right}
.info{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:.92rem;line-height:1.6;margin-top:6px}
.foot{text-align:center;color:var(--muted);font-size:.75rem;margin-top:18px}
</style>
</head>
<body>
<main class="card" id="app">
  <section id="login">
    <div class="logo">📝</div>
    <h1>Ulangan Online</h1>
    <p class="sub">Masukkan token dari guru pengawas</p>
    <label for="token">Token Ulangan</label>
    <input id="token" type="text" placeholder="ABC123" maxlength="10" autocomplete="off" autocapitalize="characters" autofocus>
    <button id="btn">Masuk</button>
    <div class="msg" id="pesanLogin"></div>
    <div class="foot">Token hanya berlaku saat ulangan dibuka oleh guru.</div>
  </section>

  <section id="ready" class="hidden">
    <div class="logo">📅</div>
    <h1>Jadwal Ulangan</h1>
    <p class="sub">Token valid. Cek informasi di bawah, lalu buka soal.</p>
    <div class="info" id="detail"></div>
    <button id="bukaSoal">Buka Soal</button>
    <div class="msg" id="noLink"></div>
    <button id="keluar" style="background:transparent;color:var(--muted);border:1px solid var(--border);margin-top:10px">Ganti Token</button>
  </section>

  <section id="soal" class="hidden">
    <div class="bar">
      <div><b id="sMapel"></b><br><small id="sKelas"></small></div>
      <div class="timer" id="timer">--:--:--</div>
    </div>
    <iframe id="frame" title="Soal ulangan" referrerpolicy="no-referrer"></iframe>
    <div class="msg" id="lock"></div>
    <a class="sm" id="tab" href="#" target="_blank" rel="noopener">Form tidak tampil? Buka di tab baru</a>
  </section>
</main>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyD7blZjsFpVMNigJuZKl8Z0wrknwzW2sOcNVPtJdqud95-W8peuFz6QpAVeAfAWwTJ/exec";
const getEl = id => document.getElementById(id);
const tampilPesan = t => getEl("pesanLogin").textContent = t || "";
let session = null;
let tick = null;

/* ---------- Ambil nilai dari server dengan berbagai kemungkinan nama key ---------- */
function ambil(r, names){
  for(const n of names){
    if(r[n] !== undefined && r[n] !== null && String(r[n]).trim() !== "") return r[n];
  }
  const low = {};
  Object.keys(r).forEach(k => low[k.toLowerCase().replace(/[\s_]/g,"")] = r[k]);
  for(const n of names){
    const v = low[n.toLowerCase().replace(/[\s_]/g,"")];
    if(v !== undefined && v !== null && String(v).trim() !== "") return v;
  }
  return "";
}

/* ---------- Ubah berbagai format tanggal menjadi yyyy-mm-dd (zona waktu perangkat) ---------- */
function normalisasiTanggal(v){
  v = String(v == null ? "" : v).trim();
  if(!v) return "";
  let d = null, m;
  const p = n => String(n).padStart(2,"0");
  if((m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v))) d = new Date(+m[1], m[2]-1, +m[3]);
  else if((m = /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(v))) d = new Date(+m[1], m[2]-1, +m[3]);
  else if((m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(v))) d = new Date(+m[3], m[2]-1, +m[1]);
  else d = new Date(v);
  if(!d || isNaN(d.getTime())) return "";
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}

/* Cadangan: cari nilai bertanggal di field mana pun (kecuali link dan jam) */
function cariTanggal(r){
  const pola = /\d{4}[-\/]\d{1,2}[-\/]\d{1,2}|\d{1,2}[\/.-]\d{1,2}[\/.-]\d{4}/;
  for(const k of Object.keys(r)){
    if(/^(link|url|jam|ok|token)$/i.test(k)) continue;
    const v = r[k];
    if(typeof v === "string" && pola.test(v)){
      const t = normalisasiTanggal(v.match(pola)[0]);
      if(t) return t;
    }
  }
  return "";
}

async function cekToken(token){
  try {
    const res = await fetch(SCRIPT_URL + "?action=cekToken&token=" + encodeURIComponent(token));
    return await res.json();
  } catch(e) {
    return { ok: false, error: "Gagal terhubung ke server. Pastikan internet Anda lancar." };
  }
}

async function prosesMasuk(){
  const token = getEl("token").value.trim().toUpperCase();
  if(!token) return tampilPesan("Token wajib diisi.");

  tampilPesan("");
  getEl("btn").disabled = true;
  getEl("btn").textContent = "Memeriksa...";

  try{
    const r = await cekToken(token);
    if(!r.ok) throw new Error(r.error || "Token tidak valid.");

    // Normalisasi data supaya tahan terhadap perbedaan nama key / format
    const raw = JSON.stringify(r, null, 2);
    r.tanggal = normalisasiTanggal(ambil(r, ["tanggal","tgl","date","hari_tanggal","hari"])) || cariTanggal(r);
    r.jam     = String(ambil(r, ["jam","waktu","time"]));
    r.kelas   = String(ambil(r, ["kelas","class"]));
    r.mapel   = String(ambil(r, ["mapel","mataPelajaran","matapelajaran","pelajaran"]));
    r.link    = String(ambil(r, ["link","url","linkSoal","soal"]));
    r.durasi  = Number(ambil(r, ["durasi","duration"])) || 0;

    session = {token, mapel:r.mapel, kelas:r.kelas, durasi:r.durasi, r:r};
    buatTampilanJadwal(r);

    if(!r.tanggal){
      const w = document.createElement("div");
      w.style.cssText = "margin-top:10px;font-size:.78rem;color:var(--err);line-height:1.5";
      w.textContent = "Tanggal tidak diterima dari server. Versi script: " + (r.versi || "lama (belum v3)") +
        ". Field diterima: " + Object.keys(r).join(", ");
      getEl("detail").appendChild(w);
    }

    if(/[?&]debug=1/.test(location.search)){
      const pre = document.createElement("pre");
      pre.style.cssText = "white-space:pre-wrap;word-break:break-all;font-size:.75rem;margin:10px 0 0;color:var(--muted)";
      pre.textContent = "DATA DARI SERVER:\n" + raw;
      getEl("detail").appendChild(pre);
    }

    getEl("login").classList.add("hidden");
    getEl("ready").classList.remove("hidden");
  }catch(e){
    tampilPesan(e.message);
  }finally{
    getEl("btn").disabled = false;
    getEl("btn").textContent = "Masuk";
  }
}

function buatTampilanJadwal(r){
  let namaHari = "-";
  let formatTgl = "-";

  if(r.tanggal){
    const p = r.tanggal.split("-");
    const d = new Date(+p[0], +p[1]-1, +p[2]);
    if(!isNaN(d.getTime())){
      namaHari = d.toLocaleDateString("id-ID", { weekday: "long" });
      formatTgl = d.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
    }
  }

  const row = (k,v)=>'<div class="row"><span>'+k+'</span><b>'+esc(v||"-")+'</b></div>';
  getEl("detail").innerHTML = row("Hari", namaHari) + row("Tanggal", formatTgl) + row("Jam", r.jam) + row("Kelas", r.kelas) + row("Mata Pelajaran", r.mapel);

  const linkValid = String(r.link || "").trim().length > 5;
  getEl("bukaSoal").disabled = !linkValid;
  getEl("noLink").textContent = linkValid ? "" : "Peringatan: Link soal kosong di database guru.";
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

const KEY = () => "ulangan_dl_" + session.token + "_" + session.r.tanggal;

function parseTime(r, idx){
  const m = /(\d{1,2})[.:](\d{2})\s*[-–]\s*(\d{1,2})[.:](\d{2})/.exec(r.jam||"");
  if(!m || !r.tanggal) return null;
  const p = r.tanggal.split("-");
  const h = parseInt(m[idx*2+1]), mn = parseInt(m[idx*2+2]);
  const d = new Date(+p[0], +p[1]-1, +p[2], h, mn, 0);
  return isNaN(d.getTime()) ? null : d.getTime();
}

function getDeadline(r){
  let dl = null;
  try{ const s = localStorage.getItem(KEY()); if(s) dl = +s; }catch(e){}
  if(dl === null){
    const c = [];
    if(r.durasi) c.push(Date.now() + r.durasi*60000);
    const en = parseTime(r,1); if(en) c.push(en);
    if(c.length) dl = Math.min(...c);
    if(dl !== null) try{ localStorage.setItem(KEY(), String(dl)); }catch(e){}
  }
  return dl;
}

function fmt(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  return [Math.floor(s/3600), Math.floor(s%3600/60), s%60].map(n=>String(n).padStart(2,"0")).join(":");
}

function toEmbed(u){
  if(/docs\.google\.com\/forms/.test(u) && !/embedded=true/.test(u)) return u + (u.includes("?")?"&":"?") + "embedded=true";
  return u;
}

function kunciAkses(){
  clearInterval(tick);
  getEl("frame").src = "about:blank";
  getEl("frame").classList.add("hidden");
  getEl("tab").classList.add("hidden");
  getEl("timer").textContent = "00:00:00";
  getEl("timer").classList.add("warn");
  getEl("lock").textContent = "Waktu pengerjaan habis. Soal telah ditutup.";
}

function mulaiUjian(){
  const r = session.r, now = Date.now();
  const st = parseTime(r,0);

  if(st && now < st) return getEl("noLink").textContent = "Ulangan belum dimulai sesuai jadwal.";
  const dl = getDeadline(r);
  if(dl !== null && now >= dl) return getEl("noLink").textContent = "Waktu ulangan telah berakhir. Soal tidak dapat dibuka.";

  getEl("ready").classList.add("hidden");
  getEl("soal").classList.remove("hidden");
  getEl("app").classList.add("wide");

  getEl("sMapel").textContent = r.mapel || "Ulangan";
  getEl("sKelas").textContent = r.kelas || "";

  const finalLink = String(r.link).trim();
  getEl("frame").src = toEmbed(finalLink);
  getEl("tab").href = finalLink;

  if(dl === null){ getEl("timer").textContent = "Tanpa batas"; return; }

  const upd = () => {
    const left = dl - Date.now();
    if(left <= 0) return kunciAkses();
    getEl("timer").textContent = fmt(left);
    getEl("timer").classList.toggle("warn", left < 300000);
  };
  upd();
  tick = setInterval(upd, 1000);
}

getEl("btn").onclick = prosesMasuk;
getEl("bukaSoal").onclick = mulaiUjian;

getEl("token").addEventListener("keydown", e => {
  if(e.key === "Enter") prosesMasuk();
});

getEl("keluar").onclick = () => {
  session = null;
  getEl("token").value = "";
  getEl("ready").classList.add("hidden");
  getEl("login").classList.remove("hidden");
  getEl("app").classList.remove("wide");
};
</script>
</body>
</html>
